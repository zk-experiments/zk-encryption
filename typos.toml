# typos (https://github.com/crate-ci/typos) configuration.

[files]
extend-exclude = [
  "CHANGELOG.md",
  "**/Cargo.lock",
  "noir/**/vectors.nr",
  "rust/zk-encryption-circuits/resources/**",
  "rust/zk-encryption-circuits/assets/**",
  "rust/zk-encryption-circuits/circuits/manifest.toml",
]

[default]
extend-ignore-re = [
  # Hex constants (digests, domain tags, field elements).
  "\\b[0-9a-fA-F]{16,}\\b",
  "0x[0-9a-fA-F]+",
]
