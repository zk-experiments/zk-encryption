# ------------------------------------------------------------ families (hand-written; freeze keeps them)

# The session app: the channel's KEM and C_t, [ctx, C_t, E.x, E.y, tag, ct_commitment], all public; no link.
# ctx is a public input passed through: the envelopes (and a transfer) are bound to it and to C_t.
[[family]]
layer = "channel"
name = "session"
members = ["channel_session"]
public_from = 0
slots = ["ctx", "c_t", "e_x", "e_y", "tag", "ct_commitment"]

# The payload envelope app, [payload_commitment, ctx, C_t, domain, c × 6], bound to the session's ctx and C_t.
# One circuit, two families: each pins the payload domain (K = H(KEY, S_t, ctx, domain)) with a constant
# binding the kernel enforces, so two envelopes of one pipeline never share a keystream.
# KEY_PAYLOAD: domain = "pq-ratchet/key-payload/v1" (an identity payload, e.g. a passport's DG1).
[[family]]
layer = "channel"
name = "envelope"
members = ["channel_envelope"]
link_in = { index = 0, link = "PayloadCommitment" }
binds = [{ slot = "ctx", index = 1 }, { slot = "c_t", index = 2 }]
bind_const = [{ index = 3, value = "0x70712d726174636865742f6b65792d7061796c6f61642f7631" }]
public_from = 4
slots = ["c_id0", "c_id1", "c_id2", "c_id3", "c_id4", "c_id5"]

# KEY_NOTE: domain = "pq-ratchet/key-note/v1" (a note opening).
[[family]]
layer = "channel"
name = "note_envelope"
members = ["channel_envelope"]
link_in = { index = 0, link = "PayloadCommitment" }
binds = [{ slot = "ctx", index = 1 }, { slot = "c_t", index = 2 }]
bind_const = [{ index = 3, value = "0x70712d726174636865742f6b65792d6e6f74652f7631" }]
public_from = 4
slots = ["c_note0", "c_note1", "c_note2", "c_note3", "c_note4", "c_note5"]
